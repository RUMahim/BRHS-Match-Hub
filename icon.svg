<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2b200a"/>
      <stop offset="100%" stop-color="#070707"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D77A"/>
      <stop offset="50%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#8A6A12"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="92" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.4"/>
  <!-- Gold Shield / Ring -->
  <circle cx="256" cy="236" r="140" fill="#121009" stroke="url(#gold)" stroke-width="8" filter="url(#glow)"/>
  <circle cx="256" cy="236" r="126" fill="none" stroke="#2f260d" stroke-width="3"/>
  <!-- Football icon -->
  <g fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="256" cy="236" r="105" fill="#17130a"/>
    <!-- Central Pentagon -->
    <polygon points="256,186 298,216 282,266 230,266 214,216" fill="url(#gold)" stroke="#17130a" stroke-width="4"/>
    <!-- Radiating Seams -->
    <line x1="256" y1="186" x2="256" y2="131"/>
    <line x1="298" y1="216" x2="350" y2="198"/>
    <line x1="282" y1="266" x2="320" y2="315"/>
    <line x1="230" y1="266" x2="192" y2="315"/>
    <line x1="214" y1="216" x2="162" y2="198"/>
    <!-- Outer polygons -->
    <polygon points="256,131 220,137 202,154" stroke="#8A6A12" stroke-width="4"/>
    <polygon points="256,131 292,137 310,154" stroke="#8A6A12" stroke-width="4"/>
  </g>
  <!-- Text: BRHS -->
  <text x="256" y="420" font-family="Montserrat, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#gold)" text-anchor="middle" letter-spacing="8">BRHS</text>
  <text x="256" y="456" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="700" fill="#9a927c" text-anchor="middle" letter-spacing="4">SEASON 03</text>
</svg>