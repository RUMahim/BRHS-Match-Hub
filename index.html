<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="theme-color" content="#070707">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <title>EX BRHSIAN Football Festival – Season 03 Match Hub</title>
        <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js">
        <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js">
        <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Cormorant+Garamond:ital,wght@1,600&family=Montserrat:wght@500;700;800&display=swap">
        <style>
            :root {
                color-scheme: dark;
                --bg: #070707;
                --card: #121009;
                --line: #2f260d;
                --gold: #F5D77A;
                --gold2: #C9A227;
                --txt: #f3efe4;
                --mut: #9a927c
            }

            * {
                box-sizing: border-box
            }

            html {
                padding-top: env(safe-area-inset-top,0px);
                padding-bottom: env(safe-area-inset-bottom,0px);
                background: var(--bg)
            }

            body {
                margin: 0;
                background: radial-gradient(ellipse at 80% 0,#2b200a,var(--bg) 55%) fixed;
                color: var(--txt);
                font: 500 14px Montserrat,Arial,sans-serif
            }

            .w {
                max-width: 760px;
                margin: 0 auto;
                padding: 16px 14px 60px
            }

            header {
                display: flex;
                align-items: center;
                gap: 14px;
                padding: 6px 0 14px
            }

            header img {
                width: 78px;
                height: auto
            }

            h1 {
                margin: 0;
                font: 400 30px/1 Anton,Impact,sans-serif;
                letter-spacing: .04em;
                text-transform: uppercase;
                background: linear-gradient(180deg,#fff,#d8cfae);
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent
            }

            h1 b {
                font-weight: 400;
                background: linear-gradient(180deg,var(--gold),var(--gold2));
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent
            }

            .sub {
                color: var(--gold2);
                font-weight: 800;
                letter-spacing: .35em;
                font-size: 11px;
                margin-top: 6px
            }

            .chips {
                display: grid;
                grid-template-columns: repeat(3,1fr);
                gap: 8px;
                margin-bottom: 14px
            }

            .chip {
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 12px;
                padding: 10px;
                text-align: center
            }

            .chip b {
                display: block;
                font: 400 26px Anton,Impact,sans-serif;
                color: var(--gold)
            }

            .chip span {
                font-size: 10px;
                letter-spacing: .14em;
                color: var(--mut);
                font-weight: 700;
                text-transform: uppercase
            }

            nav {
                display: flex;
                gap: 6px;
                position: sticky;
                top: 0;
                z-index: 5;
                background: #070707ee;
                padding: 8px 0;
                margin-bottom: 6px;
                overflow-x: auto
            }

            nav button {
                flex: 1;
                min-height: 44px;
                white-space: nowrap;
                border: 1px solid var(--line);
                background: var(--card);
                color: var(--mut);
                border-radius: 10px;
                font: 800 12px Montserrat,Arial;
                letter-spacing: .1em;
                padding: 0 12px;
                cursor: pointer
            }

            nav button.on {
                background: linear-gradient(180deg,var(--gold),var(--gold2) 60%,#8A6A12);
                color: #1a1204;
                border: 0
            }

            .m {
                position: relative;
                background: linear-gradient(160deg,#17130a,#0c0b07);
                border: 1px solid var(--line);
                border-radius: 14px;
                padding: 12px 14px;
                margin-top: 10px;
                overflow: hidden
            }

            .m::before {
                content: "";
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                width: 3px;
                background: linear-gradient(var(--gold),var(--gold2))
            }

            .top {
                display: flex;
                justify-content: space-between;
                font-size: 10px;
                letter-spacing: .16em;
                color: var(--mut);
                font-weight: 700;
                text-transform: uppercase
            }

            .sc {
                display: grid;
                grid-template-columns: 1fr auto 1fr;
                align-items: center;
                gap: 10px;
                margin: 10px 0
            }

            .tm {
                font: 800 15px Montserrat,Arial;
                text-transform: uppercase
            }

            .tm:last-child {
                text-align: right
            }

            .s {
                font: 400 38px/1 Anton,Impact,sans-serif;
                color: var(--gold);
                letter-spacing: .06em
            }

            .s i {
                color: var(--gold2);
                font-style: normal;
                margin: 0 6px
            }

            .win {
                color: #fff
            }

            .gl {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
                font-size: 12px;
                color: #cfc8b2;
                border-top: 1px solid var(--line);
                padding-top: 8px
            }

            .gl div:last-child {
                text-align: right
            }

            .gl p {
                margin: 2px 0
            }

            .mo {
                margin-top: 10px;
                display: flex;
                align-items: center;
                gap: 8px;
                background: #1d1706;
                border: 1px solid #4a3a10;
                border-radius: 10px;
                padding: 8px 10px;
                font-size: 11px;
                letter-spacing: .1em;
                color: var(--gold2);
                font-weight: 800
            }

            .mo b {
                color: var(--gold);
                font-size: 13px;
                letter-spacing: .04em;
                text-transform: uppercase
            }

            .x {
                position: absolute;
                right: 8px;
                top: 6px;
                background: none;
                border: 0;
                color: #5b5238;
                font-size: 14px;
                min-width: 32px;
                min-height: 32px;
                cursor: pointer
            }

            .row {
                display: grid;
                grid-template-columns: 34px 1fr auto;
                gap: 10px;
                align-items: center;
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 12px;
                padding: 10px 12px;
                margin-top: 8px
            }

            .rk {
                font: 400 24px Anton,Impact,sans-serif;
                color: var(--gold2);
                text-align: center
            }

            .row small {
                display: block;
                color: var(--mut);
                font-size: 11px;
                letter-spacing: .08em
            }

            .bar {
                height: 5px;
                border-radius: 3px;
                background: #000;
                margin-top: 6px;
                overflow: hidden
            }

            .bar i {
                display: block;
                height: 100%;
                background: linear-gradient(90deg,#8A6A12,var(--gold))
            }

            .g {
                font: 400 28px Anton,Impact,sans-serif;
                color: var(--gold)
            }

            .boot {
                border-color: var(--gold2);
                background: linear-gradient(160deg,#241a06,#120f06)
            }

            .tag {
                display: inline-block;
                font-size: 9px;
                letter-spacing: .14em;
                background: var(--gold);
                color: #1a1204;
                border-radius: 4px;
                padding: 2px 6px;
                margin-left: 6px;
                font-weight: 800;
                vertical-align: middle
            }

            table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 10px;
                background: var(--card);
                border-radius: 12px;
                overflow: hidden;
                font-size: 13px
            }

            th,td {
                padding: 10px 6px;
                text-align: center
            }

            th {
                font-size: 10px;
                letter-spacing: .12em;
                color: var(--mut);
                border-bottom: 1px solid var(--line)
            }

            td:nth-child(2),th:nth-child(2) {
                text-align: left;
                font-weight: 800;
                text-transform: uppercase
            }

            td:last-child {
                color: var(--gold);
                font-weight: 800
            }

            .sw {
                overflow-x: auto
            }

            form {
                display: grid;
                gap: 10px;
                margin-top: 10px;
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 14px;
                padding: 14px
            }

            label {
                font-size: 10px;
                letter-spacing: .14em;
                color: var(--mut);
                font-weight: 700;
                text-transform: uppercase;
                display: grid;
                gap: 4px
            }

            input {
                background: #0b0a06;
                border: 1px solid #3a2f12;
                color: #fff;
                border-radius: 8px;
                padding: 11px;
                font: 600 14px Montserrat,Arial;
                min-height: 44px;
                width: 100%
            }

            .two {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px
            }

            .btn {
                min-height: 46px;
                border: 0;
                border-radius: 10px;
                font: 800 13px Montserrat,Arial;
                letter-spacing: .12em;
                background: linear-gradient(180deg,var(--gold),var(--gold2) 60%,#8A6A12);
                color: #1a1204;
                cursor: pointer
            }

            .btn.g2 {
                background: var(--card);
                color: var(--gold);
                border: 1px solid #5a4716
            }

            .note {
                color: var(--mut);
                font-size: 11px;
                margin-top: 10px;
                line-height: 1.5
            }

            .empty {
                color: var(--mut);
                text-align: center;
                padding: 30px 0
            }

            .up {
                opacity: .97
            }

            .up .s em {
                font: 800 13px Montserrat,Arial;
                color: var(--gold2);
                letter-spacing: .2em;
                font-style: normal
            }

            .eb {
                width: 100%;
                min-height: 44px;
                margin-top: 10px;
                background: none;
                border: 1px dashed #5a4716;
                color: var(--gold);
                border-radius: 10px;
                font: 800 12px Montserrat,Arial;
                letter-spacing: .12em;
                cursor: pointer
            }

            .m:not(.up) .eb {
                border-style: solid;
                border-color: var(--line);
                color: var(--mut)
            }

            .pen {
                margin-top: 8px;
                font-size: 11px;
                color: var(--gold2);
                font-weight: 700;
                letter-spacing: .06em
            }

            .sh {
                position: fixed;
                inset: 0;
                background: rgba(0,0,0,.82);
                z-index: 20;
                display: flex;
                align-items: flex-end;
                justify-content: center
            }

            .sh[hidden] {
                display: none
            }

            .sheet {
                width: 100%;
                max-width: 560px;
                max-height: 94vh;
                overflow: auto;
                background: #0f0d07;
                border: 1px solid #5a4716;
                border-radius: 16px 16px 0 0;
                padding: 16px 14px calc(16px + env(safe-area-inset-bottom,0px))
            }

            .sheet h2 {
                margin: 0 0 4px;
                font: 400 22px Anton,Impact,sans-serif;
                color: var(--gold);
                letter-spacing: .04em
            }

            .sheet form {
                border: 0;
                padding: 0;
                margin-top: 8px;
                background: none
            }

            .stg {
                margin: 18px 0 2px;
                font: 800 11px Montserrat,Arial;
                letter-spacing: .3em;
                color: var(--gold2);
                text-transform: uppercase
            }

            .fl {
                display: flex;
                gap: 6px;
                overflow-x: auto;
                margin-top: 6px
            }

            .fl button {
                min-height: 36px;
                border: 1px solid var(--line);
                background: var(--card);
                color: var(--mut);
                border-radius: 18px;
                padding: 0 14px;
                font: 800 11px Montserrat,Arial;
                letter-spacing: .1em;
                cursor: pointer;
                white-space: nowrap
            }

            .fl button.on {
                color: #1a1204;
                background: var(--gold);
                border: 0
            }

            .nx {
                display: inline-block;
                font-size: 9px;
                letter-spacing: .14em;
                background: #2a3a10;
                color: #cfe88a;
                border-radius: 4px;
                padding: 2px 6px;
                margin-left: 6px
            }

            .gh {
                margin: 16px 0 0;
                font: 400 18px Anton,Impact,sans-serif;
                color: var(--gold);
                letter-spacing: .06em
            }

            tr.q td:first-child {
                box-shadow: inset 3px 0 var(--gold2)
            }

            .ven {
                margin-top: 24px;
                text-align: center;
                color: var(--mut);
                font-size: 11px;
                letter-spacing: .08em
            }

            .adm {
                font: 800 10px Montserrat,Arial;
                letter-spacing: .12em;
                color: #cfe88a;
                margin-top: 6px
            }

            .updt {
                font-size: 10px;
                color: var(--mut);
                margin-top: 4px
            }

            .ven a {
                color: var(--gold);
                text-decoration: none;
                font-size: 15px;
                font-weight: 700;
                letter-spacing: .1em;
                display: inline-block;
                margin-top: 14px;
                padding: 14px 28px;
                border: 1px solid #3a321c;
                border-radius: 999px
            }

            .ven .ft1 {
                font-size: 12px;
                font-weight: 700;
                letter-spacing: .14em;
                text-transform: uppercase;
                color: var(--mut)
            }

            .ven .ft2 {
                font: italic 600 17px/1.5 'Cormorant Garamond',Georgia,serif;
                letter-spacing: .04em;
                color: var(--mut)
            }

            .ven .ft2 a.cr {
                font: 700 12px Montserrat,Arial,sans-serif;
                letter-spacing: .22em;
                text-transform: uppercase;
                border: 0;
                border-radius: 0;
                padding: 0 0 3px;
                margin: 2px 0 0;
                color: var(--gold);
                border-bottom: 1px solid var(--gold2)
            }

            .sheet .lgh {
                width: 56px;
                height: 56px;
                margin: 0 auto 10px;
                display: grid;
                place-items: center;
                font-size: 24px;
                border-radius: 50%;
                background: #14110a;
                border: 1px solid var(--gold2)
            }

            .sheet h2.lgt {
                text-align: center;
                color: var(--gold);
                letter-spacing: .18em
            }

            .sheet .lgs {
                text-align: center;
                color: var(--mut);
                font-size: 12px;
                margin: 4px 0 18px
            }

            #toast {
                position: fixed;
                left: 50%;
                bottom: calc(20px + env(safe-area-inset-bottom,0px));
                transform: translate(-50%,20px);
                max-width: 92vw;
                padding: 12px 18px;
                border-radius: 10px;
                font: 700 13px Montserrat,Arial,sans-serif;
                opacity: 0;
                pointer-events: none;
                transition: opacity .25s,transform .25s;
                z-index: 50;
                background: #17130a;
                border: 1px solid #C9A227;
                color: #F5D77A;
                text-align: center
            }

            #toast.on {
                opacity: 1;
                transform: translate(-50%,0)
            }

            #toast.bad {
                border-color: #c0392b;
                color: #ffb4a8
            }

            .cds {
                margin-top: 6px;
                border-top: 0;
                padding-top: 0
            }

            .cds p {
                margin: 2px 0
            }
        
            .tag.lvt{background:#d92b2b;color:#fff;animation:lvp 1.2s infinite}
            .tag.ft{background:#2a2410;color:var(--gold);border:1px solid var(--line)}
            @keyframes lvp{50%{opacity:.5}}
            .m.lv{border-color:#6b1f1f}
            .m.lv::before{background:#d92b2b}
            .lvb{display:flex;gap:8px;align-items:center;background:#2a0d0d;border:1px solid #6b1f1f;border-radius:10px;padding:9px 12px;margin-top:10px;font:800 12px Montserrat,Arial;letter-spacing:.08em;color:#ffd7d7;text-transform:uppercase}
            .lvd{flex:none;width:8px;height:8px;border-radius:50%;background:#ff3b3b;animation:lvp 1.2s infinite}
        
            .sb{width:100%;min-height:44px;margin-top:10px;background:none;border:1px solid var(--line);color:var(--gold);border-radius:10px;font:800 12px Montserrat,Arial;letter-spacing:.12em;cursor:pointer}
            .sb:active{background:#1d1706}
        </style>
    </head>

                  , r = R[n] || {}
                  , F = $('ef').elements;
                $('sht').textContent = 'MATCH #' + String(n).padStart(2, '0');
                $('shs').innerHTML = '<span>' + ST[f[0]] + '</span><span>' + f[3] + '</span>';
                F.ta.value = nm(n, 'a');
                F.tb.value = nm(n, 'b');
                F.sa.value = r.done || r.live ? r.sa : '';
                F.sb.value = r.done || r.live ? r.sb : '';
                F.ga.value = (r.ga || []).map(g => g[0] + (g[1] > 1 ? ' ' + g[1] : '')).join(', ');
                F.gb.value = (r.gb || []).map(g => g[0] + (g[1] > 1 ? ' ' + g[1] : '')).join(', ');
                const fm = a => (a || []).map(g => g[0] + (g[1] > 1 ? ' ' + g[1] : '')).join(', ');
                F.ya.value = fm(r.ya);
                F.yb.value = fm(r.yb);
                F.ra.value = fm(r.ra);
                F.rb.value = fm(r.rb);
                F.mo.value = r.mo || '';
                F.mt.value = r.mt || '';
                F.pw.value = r.pw || '';
                $('pwl').hidden = f[0] == 'G';
                $('clr').hidden = !(r.done || r.live);
                F.st.value = r.live && !r.done ? 'live' : 'ft';
                F.lm.value = r.lm || '';
                $('sh').hidden = false
            }
            const closeEdit = () => {
                $('sh').hidden = true
            }
            ;
            $('cx').onclick = closeEdit;
            $('sh').onclick = e => {
                if (e.target == $('sh'))
                    closeEdit()
            }
            ;
            addEventListener('keydown', e => {
                if (e.key == 'Escape')
                    closeEdit()
            }
            );
            $('ef').onsubmit = e => {
                e.preventDefault();
                const F = e.target.elements
                  , n = cur
                  , r = {
                    done: F.st.value !== 'live',
                    live: F.st.value === 'live',
                    lm: F.st.value === 'live' ? F.lm.value.trim() : '',
                    sa: +F.sa.value || 0,
                    sb: +F.sb.value || 0,
                    ga: parse(F.ga.value),
                    gb: parse(F.gb.value),
                    ya: parse(F.ya.value),
                    yb: parse(F.yb.value),
                    ra: parse(F.ra.value),
                    rb: parse(F.rb.value),
                    mo: F.mo.value.trim(),
                    mt: F.mt.value,
                    pw: F.pw.value
                };
                const ta = F.ta.value.trim()
                  , tb = F.tb.value.trim();
                if (ta && ta !== nm(n, 'a', true))
                    r.ta = ta;
                if (tb && tb !== nm(n, 'b', true))
                    r.tb = tb;
                const pv = snap();
                R[n] = r;
                render();
                closeEdit();
                persist(pv)
            }
            ;
            $('clr').onclick = () => {
                if (confirm('Clear the result of this match?')) {
                    const pv = snap();
                    delete R[cur];
                    render();
                    closeEdit();
                    persist(pv)
                }
            }
            ;
            $('t').onsubmit = e => {
                e.preventDefault();
                const F = e.target.elements
                  , g = {};
                Object.keys(G).forEach(k => {
                    g[k] = F['g' + k].value.split(',').map(x => x.trim()).filter(Boolean).map(x => x.padStart(2, '0'))
                }
                );
                const pv = snap();
                G = g;
                render();
                persist(pv)
            }
            ;

            const snap = () => JSON.stringify({
                R,
                G
            });
            function toast(m, ok) {
                const t = $('toast');
                t.textContent = m;
                t.className = 'on ' + (ok ? 'ok' : 'bad');
                clearTimeout(toast.t);
                toast.t = setTimeout( () => {
                    t.className = ''
                }
                , 4500)
            }
            function hdr() {
                $('adm').textContent = MODE === 'local' ? 'DEMO MODE · results save on this device only (add Firebase config to share live)' : ADMIN ? 'ADMIN MODE · tap a match to enter or edit its result' : '';
                $('upd').textContent = U0 ? 'Last updated ' + new Date(U0).toLocaleString([], {
                    day: 'numeric',
                    month: 'short',
                    hour: '2-digit',
                    minute: '2-digit'
                }) : '';
                $('lgl').hidden = MODE === 'local';
                $('lgl').textContent = ADMIN ? 'Admin logout' : 'Admin login'
            }
            async function persist(prev) {
                const st = {
                    R,
                    G
                }
                  , u = Date.now();
                if (MODE === 'local') {
                    try {
                        localStorage.setItem('brhsHubLocal', JSON.stringify(st))
                    } catch (e) {}
                    U0 = u;
                    hdr();
                    return
                }
                try {
                    await F.setDoc(F.doc(DB, 'hub', 'season3'), {
                        json: JSON.stringify(st),
                        u
                    })
                } catch (e) {
                    try {
                        const p = JSON.parse(prev);
                        R = p.R;
                        G = p.G
                    } catch (_) {}
                    render();
                    toast(e.code === 'permission-denied' ? 'Not allowed. Log in as admin.' : '✕ Not saved (' + (e.code || 'error') + '). Try again.', false)
                }
            }
            async function initFb() {
                if (!CFG.apiKey) {
                    MODE = 'local';
                    ADMIN = true;
                    try {
                        const s = JSON.parse(localStorage.getItem('brhsHubLocal') || 'null');
                        if (s) {
                            R = s.R || {};
                            G = s.G || G
                        }
                    } catch (e) {}
                    render();
                    hdr();
                    return
                }
                const B = 'https://www.gstatic.com/firebasejs/10.12.2/';
                try {
                    const authP = import(B + 'firebase-auth.js');
                    authP.catch( () => {});
                    const [A,Fs] = await Promise.all([import(B + 'firebase-app.js'), import(B + 'firebase-firestore.js')]);
                    const app = A.initializeApp(CFG);
                    try {
                        DB = Fs.initializeFirestore(app, {
                            localCache: Fs.persistentLocalCache({
                                tabManager: Fs.persistentMultipleTabManager()
                            }),
                            experimentalAutoDetectLongPolling: true
                        });
                    } catch (e) {
                        DB = Fs.getFirestore(app)
                    }
                    F = Fs;
                    F.onSnapshot(F.doc(DB, 'hub', 'season3'), s => {
                        if (s.exists()) {
                            try {
                                const st = JSON.parse(s.data().json);
                                R = st.R || {};
                                if (st.G)
                                    G = st.G;
                                U0 = s.data().u || 0;
                                try {
                                    localStorage.setItem('brhsHubCache', JSON.stringify({
                                        R,
                                        G,
                                        u: U0
                                    }))
                                } catch (_) {}
                            } catch (e) {}
                        }
                        render();
                        hdr()
                    }
                    , e => toast('Could not load results (' + (e.code || 'error') + ')', false));
                    authP.then(Au => {
                        AU = Au;
                        AUTH = Au.getAuth(app);
                        AU.onAuthStateChanged(AUTH, u => {
                            ADMIN = !!u && (!ADMIN_EMAILS.length || ADMIN_EMAILS.includes(u.email));
                            render();
                            hdr()
                        }
                        )
                    }
                    ).catch( () => toast('Login service is unavailable. Check your connection.', false));
                } catch (e) {
                    toast('Live results are unavailable. Check your connection.', false)
                }
            }
            $('lgl').onclick = e => {
                e.preventDefault();
                if (ADMIN && AUTH)
                    AU.signOut(AUTH);
                else
                    $('lg').hidden = false
            }
            ;
            $('lcx').onclick = () => {
                $('lg').hidden = true
            }
            ;
            $('lf').onsubmit = async e => {
                e.preventDefault();
                if (!AUTH) {
                    toast('Live service is not ready yet', false);
                    return
                }
                const f = e.target.elements;
                try {
                    await AU.signInWithEmailAndPassword(AUTH, f.e.value.trim(), f.p.value);
                    $('lg').hidden = true;
                    e.target.reset();
                    toast('✓ Logged in as admin', true)
                } catch (er) {
                    toast('Login failed (' + (er.code || 'error') + ')', false)
                }
            }
            ;
            try {
                const c = JSON.parse(localStorage.getItem('brhsHubCache') || 'null');
                if (c) {
                    R = c.R || {};
                    G = c.G || G;
                    U0 = c.u || 0
                }
            } catch (e) {}
            render();
            hdr();
            initFb();
        </script>
    </body>
</html>
