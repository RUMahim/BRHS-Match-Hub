<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="theme-color" content="#070707">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>EX BRHSIAN Football Festival – Season 03 Match Hub</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@500;700;800&display=swap">
    <style>
        :root {
            color-scheme: dark;
            --bg: #070707;
            --card: #121009;
            --line: #2f260d;
            --gold: #F5D77A;
            --gold2: #C9A227;
            --txt: #f3efe4;
            --mut: #9a927c
        }

        * {
            box-sizing: border-box
        }

        html {
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            background: var(--bg)
        }

        body {
            margin: 0;
            background: radial-gradient(ellipse at 80% 0, #2b200a, var(--bg) 55%) fixed;
            color: var(--txt);
            font: 500 14px Montserrat, Arial, sans-serif
        }

        .w {
            max-width: 760px;
            margin: 0 auto;
            padding: 16px 14px 60px
        }

        header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 6px 0 14px
        }

        header img {
            width: 78px;
            height: auto
        }

        h1 {
            margin: 0;
            font: 400 30px/1 Anton, Impact, sans-serif;
            letter-spacing: .04em;
            text-transform: uppercase;
            background: linear-gradient(180deg, #fff, #d8cfae);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent
        }

        h1 b {
            font-weight: 400;
            background: linear-gradient(180deg, var(--gold), var(--gold2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent
        }

        .sub {
            color: var(--gold2);
            font-weight: 800;
            letter-spacing: .35em;
            font-size: 11px;
            margin-top: 6px
        }

        .chips {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 14px
        }

        .chip {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 10px;
            text-align: center
        }

        .chip b {
            display: block;
            font: 400 26px Anton, Impact, sans-serif;
            color: var(--gold)
        }

        .chip span {
            font-size: 10px;
            letter-spacing: .14em;
            color: var(--mut);
            font-weight: 700;
            text-transform: uppercase
        }

        nav {
            display: flex;
            gap: 6px;
            position: sticky;
            top: 0;
            z-index: 5;
            background: #070707ee;
            padding: 8px 0;
            margin-bottom: 6px;
            overflow-x: auto
        }

        nav button {
            flex: 1;
            min-height: 44px;
            white-space: nowrap;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--mut);
            border-radius: 10px;
            font: 800 12px Montserrat, Arial;
            letter-spacing: .1em;
            padding: 0 12px;
            cursor: pointer
        }

        nav button.on {
            background: linear-gradient(180deg, var(--gold), var(--gold2) 60%, #8A6A12);
            color: #1a1204;
            border: 0
        }

        .m {
            position: relative;
            background: linear-gradient(160deg, #17130a, #0c0b07);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 12px 14px;
            margin-top: 10px;
            overflow: hidden
        }

        .m::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: linear-gradient(var(--gold), var(--gold2))
        }

        .top {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            letter-spacing: .16em;
            color: var(--mut);
            font-weight: 700;
            text-transform: uppercase
        }

        .sc {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 10px;
            margin: 10px 0
        }

        .tm {
            font: 800 15px Montserrat, Arial;
            text-transform: uppercase
        }

        .tm:last-child {
            text-align: right
        }

        .s {
            font: 400 38px/1 Anton, Impact, sans-serif;
            color: var(--gold);
            letter-spacing: .06em
        }

        .s i {
            color: var(--gold2);
            font-style: normal;
            margin: 0 6px
        }

        .win {
            color: #fff
        }

        .gl {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 12px;
            color: #cfc8b2;
            border-top: 1px solid var(--line);
            padding-top: 8px
        }

        .gl div:last-child {
            text-align: right
        }

        .gl p {
            margin: 2px 0
        }

        .mo {
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1d1706;
            border: 1px solid #4a3a10;
            border-radius: 10px;
            padding: 8px 10px;
            font-size: 11px;
            letter-spacing: .1em;
            color: var(--gold2);
            font-weight: 800
        }

        .mo b {
            color: var(--gold);
            font-size: 13px;
            letter-spacing: .04em;
            text-transform: uppercase
        }

        .x {
            position: absolute;
            right: 8px;
            top: 6px;
            background: none;
            border: 0;
            color: #5b5238;
            font-size: 14px;
            min-width: 32px;
            min-height: 32px;
            cursor: pointer
        }

        .row {
            display: grid;
            grid-template-columns: 34px 1fr auto;
            gap: 10px;
            align-items: center;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 10px 12px;
            margin-top: 8px
        }

        .rk {
            font: 400 24px Anton, Impact, sans-serif;
            color: var(--gold2);
            text-align: center
        }

        .row small {
            display: block;
            color: var(--mut);
            font-size: 11px;
            letter-spacing: .08em
        }

        .bar {
            height: 5px;
            border-radius: 3px;
            background: #000;
            margin-top: 6px;
            overflow: hidden
        }

        .bar i {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, #8A6A12, var(--gold))
        }

        .g {
            font: 400 28px Anton, Impact, sans-serif;
            color: var(--gold)
        }

        .boot {
            border-color: var(--gold2);
            background: linear-gradient(160deg, #241a06, #120f06)
        }

        .tag {
            display: inline-block;
            font-size: 9px;
            letter-spacing: .14em;
            background: var(--gold);
            color: #1a1204;
            border-radius: 4px;
            padding: 2px 6px;
            margin-left: 6px;
            font-weight: 800;
            vertical-align: middle
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background: var(--card);
            border-radius: 12px;
            overflow: hidden;
            font-size: 13px
        }

        th,
        td {
            padding: 10px 6px;
            text-align: center
        }

        th {
            font-size: 10px;
            letter-spacing: .12em;
            color: var(--mut);
            border-bottom: 1px solid var(--line)
        }

        td:nth-child(2),
        th:nth-child(2) {
            text-align: left;
            font-weight: 800;
            text-transform: uppercase
        }

        td:last-child {
            color: var(--gold);
            font-weight: 800
        }

        .sw {
            overflow-x: auto
        }

        form {
            display: grid;
            gap: 10px;
            margin-top: 10px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 14px
        }

        label {
            font-size: 10px;
            letter-spacing: .14em;
            color: var(--mut);
            font-weight: 700;
            text-transform: uppercase;
            display: grid;
            gap: 4px
        }

        input {
            background: #0b0a06;
            border: 1px solid #3a2f12;
            color: #fff;
            border-radius: 8px;
            padding: 11px;
            font: 600 14px Montserrat, Arial;
            min-height: 44px;
            width: 100%
        }

        .two {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px
        }

        .btn {
            min-height: 46px;
            border: 0;
            border-radius: 10px;
            font: 800 13px Montserrat, Arial;
            letter-spacing: .12em;
            background: linear-gradient(180deg, var(--gold), var(--gold2) 60%, #8A6A12);
            color: #1a1204;
            cursor: pointer
        }

        .btn.g2 {
            background: var(--card);
            color: var(--gold);
            border: 1px solid #5a4716
        }

        .note {
            color: var(--mut);
            font-size: 11px;
            margin-top: 10px;
            line-height: 1.5
        }

        .empty {
            color: var(--mut);
            text-align: center;
            padding: 30px 0
        }

        .up {
            opacity: .97
        }

        .up .s em {
            font: 800 13px Montserrat, Arial;
            color: var(--gold2);
            letter-spacing: .2em;
            font-style: normal
        }

        .eb {
            width: 100%;
            min-height: 44px;
            margin-top: 10px;
            background: none;
            border: 1px dashed #5a4716;
            color: var(--gold);
            border-radius: 10px;
            font: 800 12px Montserrat, Arial;
            letter-spacing: .12em;
            cursor: pointer
        }

        .m:not(.up) .eb {
            border-style: solid;
            border-color: var(--line);
            color: var(--mut)
        }

        .pen {
            margin-top: 8px;
            font-size: 11px;
            color: var(--gold2);
            font-weight: 700;
            letter-spacing: .06em
        }

        .sh {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .82);
            z-index: 20;
            display: flex;
            align-items: flex-end;
            justify-content: center
        }

        .sh[hidden] {
            display: none
        }

        .sheet {
            width: 100%;
            max-width: 560px;
            max-height: 94vh;
            overflow: auto;
            background: #0f0d07;
            border: 1px solid #5a4716;
            border-radius: 16px 16px 0 0;
            padding: 16px 14px calc(16px + env(safe-area-inset-bottom, 0px))
        }

        .sheet h2 {
            margin: 0 0 4px;
            font: 400 22px Anton, Impact, sans-serif;
            color: var(--gold);
            letter-spacing: .04em
        }

        .sheet form {
            border: 0;
            padding: 0;
            margin-top: 8px;
            background: none
        }

        .stg {
            margin: 18px 0 2px;
            font: 800 11px Montserrat, Arial;
            letter-spacing: .3em;
            color: var(--gold2);
            text-transform: uppercase
        }

        .fl {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            margin-top: 6px
        }

        .fl button {
            min-height: 36px;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--mut);
            border-radius: 18px;
            padding: 0 14px;
            font: 800 11px Montserrat, Arial;
            letter-spacing: .1em;
            cursor: pointer;
            white-space: nowrap
        }

        .fl button.on {
            color: #1a1204;
            background: var(--gold);
            border: 0
        }

        .nx {
            display: inline-block;
            font-size: 9px;
            letter-spacing: .14em;
            background: #2a3a10;
            color: #cfe88a;
            border-radius: 4px;
            padding: 2px 6px;
            margin-left: 6px
        }

        .gh {
            margin: 16px 0 0;
            font: 400 18px Anton, Impact, sans-serif;
            color: var(--gold);
            letter-spacing: .06em
        }

        tr.q td:first-child {
            box-shadow: inset 3px 0 var(--gold2)
        }

        .ven {
            margin-top: 24px;
            text-align: center;
            color: var(--mut);
            font-size: 11px;
            letter-spacing: .08em
        }

        .adm {
            font: 800 10px Montserrat, Arial;
            letter-spacing: .12em;
            color: #cfe88a;
            margin-top: 6px
        }

        .updt {
            font-size: 10px;
            color: var(--mut);
            margin-top: 4px
        }

        .ven a {
            color: #6d6650;
            text-decoration: none;
            font-size: 10px;
            display: inline-block;
            padding: 10px
        }

        #toast {
            position: fixed;
            left: 50%;
            bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            transform: translate(-50%, 20px);
            max-width: 92vw;
            padding: 12px 18px;
            border-radius: 10px;
            font: 700 13px Montserrat, Arial, sans-serif;
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s, transform .25s;
            z-index: 50;
            background: #17130a;
            border: 1px solid #C9A227;
            color: #F5D77A;
            text-align: center
        }

        #toast.on {
            opacity: 1;
            transform: translate(-50%, 0)
        }

        #toast.bad {
            border-color: #c0392b;
            color: #ffb4a8
        }
    </style>
</head>

        const FX = [['G', '23', '24', '3:00 PM', 'বড়'], ['G', '15', '18', '3:00 PM', 'ছোট'], ['G', '25', '26', '3:30 PM', 'বড়'], ['G', '19', '20', '3:30 PM', 'ছোট'], ['G', '13', '14', '4:00 PM', 'বড়'], ['G', '16', '17', '4:00 PM', 'ছোট'], ['G', '09', '11', '4:30 PM', 'বড়'], ['G', '21', '22', '4:30 PM', 'ছোট'], ['G', '17', '18', '5:00 PM', 'বড়'], ['G', '23', '25', '5:00 PM', 'ছোট'], ['G', '19', '22', '5:30 PM', 'বড়'], ['G', '24', '26', '5:30 PM', 'ছোট'], ['G', '20', '21', '6:00 PM', 'বড়'], ['G', '11', '13', '6:00 PM', 'ছোট'], ['G', '15', '16', '6:30 PM', 'বড়'], ['G', '09', '14', '6:30 PM', 'ছোট'],
        ['Q', 'C2', 'R3', '7:00 PM', ''], ['Q', 'C3', 'R2', '7:00 PM', ''], ['Q', 'C4', 'R1', '7:30 PM', ''], ['Q', 'C1', 'R4', '7:30 PM', ''], ['S', 'W18', 'W20', '8:00 PM', ''], ['S', 'W17', 'W19', '8:30 PM', ''], ['F', 'W21', 'W22', '9:00 PM', '']];
        const ST = { G: 'Group stage', Q: 'Quarter final', S: 'Semi final', F: 'Grand final' };
        const $ = id => document.getElementById(id), esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        let R = {}, G = { 1: ['23', '24', '25', '26'], 2: ['15', '16', '17', '18'], 3: ['19', '20', '21', '22'], 4: ['09', '11', '13', '14'] }, flt = 'all', cur = 0;
        let U0 = 0, ADMIN = false, MODE = 'live', DB = null, AUTH = null, F = null, AU = null;

        const done = n => !!(R[n] && R[n].done);
        function parse(t) { return t.split(',').map(x => x.trim()).filter(Boolean).map(x => { const m = x.match(/^(.*?)\s*(\d+)?$/); return [m[1].trim() || x, +m[2] || 1] }) }
        function rank(g) {
            const S = {}; G[g].forEach(t => S[t] = { t, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pt: 0 });
            FX.forEach((f, i) => { if (f[0] != 'G' || !done(i + 1) || !S[f[1]] || !S[f[2]]) return; const r = R[i + 1];[[f[1], r.sa, r.sb], [f[2], r.sb, r.sa]].forEach(([t, a, b]) => { const s = S[t]; s.p++; s.gf += a; s.ga += b; if (a > b) { s.w++; s.pt += 3 } else if (a == b) { s.d++; s.pt++ } else s.l++ }) });
            return Object.values(S).sort((a, b) => b.pt - a.pt || (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf || a.t.localeCompare(b.t))
        }
        function gDone(g) { const ms = FX.map((f, i) => [f, i + 1]).filter(([f]) => f[0] == 'G' && G[g].includes(f[1]) && G[g].includes(f[2])); return ms.length > 0 && ms.every(([, n]) => done(n)) }
        function tie(g) { const r = rank(g), k = x => x.pt + '|' + (x.gf - x.ga) + '|' + x.gf; return r.length > 2 && (k(r[0]) == k(r[1]) || k(r[1]) == k(r[2])) }
        function lab(ref) { if (ref[0] == 'C') return 'Group ' + ref[1] + ' Champion'; if (ref[0] == 'R') return 'Group ' + ref[1] + ' Runner-up'; const n = +ref.slice(1); return n > 20 ? 'SF' + (n - 20) + ' Winner' : 'QF' + (n - 16) + ' Winner' }
        function resolve(ref) { const c = ref[0]; if (c == 'C' || c == 'R') { const g = ref[1]; return gDone(g) ? 'BRHS ' + rank(g)[c == 'C' ? 0 : 1].t : null } if (c == 'W') return win(+ref.slice(1)); return 'BRHS ' + ref }
        function nm(n, s, ign) { const o = !ign && R[n] && R[n]['t' + s]; if (o) return o; const ref = FX[n - 1][s == 'a' ? 1 : 2]; return resolve(ref) || lab(ref) }
        function win(n) { const r = R[n]; if (!r || !r.done) return null; const a = nm(n, 'a'), b = nm(n, 'b'); return r.sa > r.sb ? a : r.sb > r.sa ? b : r.pw == 'a' ? a : r.pw == 'b' ? b : null }
        const gl = a => a && a.length ? a.map(g => '<p>⚽ ' + esc(g[0]) + (g[1] > 1 ? ' ×' + g[1] : '') + '</p>').join('') : '<p style="color:#6d6650">-</p>';
        function card(n, nx) {
            const f = FX[n - 1], r = R[n], d = done(n), a = nm(n, 'a'), b = nm(n, 'b'), w = d ? win(n) : null;
            return '<div class="m' + (d ? '' : ' up') + '"><div class="top"><span>#' + String(n).padStart(2, '0') + ' · ' + ST[f[0]] + (nx ? '<span class="nx">NEXT</span>' : '') + '</span><span>' + f[3] + (f[4] ? ' · ' + f[4] : '') + '</span></div>'
                + '<div class="sc"><div class="tm">' + esc(a) + '</div><div class="s">' + (d ? '<span class="' + (r.sa > r.sb ? 'win' : '') + '">' + r.sa + '</span><i>–</i><span class="' + (r.sb > r.sa ? 'win' : '') + '">' + r.sb + '</span>' : '<em>VS</em>') + '</div><div class="tm">' + esc(b) + '</div></div>'
                + (d ? '<div class="gl"><div>' + gl(r.ga) + '</div><div>' + gl(r.gb) + '</div></div>' + (r.sa == r.sb && w ? '<div class="pen">Won on penalties: ' + esc(w) + '</div>' : '') + (r.mo ? '<div class="mo">★ MAN OF THE MATCH <b>' + esc(r.mo) + '</b></div>' : '') : '')
                + (ADMIN ? '<button class="eb" data-n="' + n + '">' + (d ? '✎ EDIT RESULT' : '+ ENTER RESULT') + '</button>' : '') + '</div>'
        }
        function render() {
            let nx = 0; for (let n = 1; n <= 23; n++)if (!done(n)) { nx = n; break }
            let out = '', last = ''; FX.forEach((f, i) => { if (flt != 'all' && f[0] != flt) return; if (f[0] != last) { out += '<div class="stg">' + ST[f[0]] + '</div>'; last = f[0] } out += card(i + 1, i + 1 == nx) }); $('ml').innerHTML = out;
            const P = {}; let goals = 0, played = 0;
            FX.forEach((f, i) => { const n = i + 1; if (!done(n)) return; const r = R[n]; played++; goals += r.sa + r.sb;[['a', r.ga], ['b', r.gb]].forEach(([s, g]) => (g || []).forEach(([p, c]) => { const t=nm(n,s);
const k=t.trim().toLowerCase()+'::'+p.trim().toLowerCase();
(P[k]||(P[k]={n:p,t,g:0})).g+=c })) });
            const L = Object.values(P).sort((a, b) => b.g - a.g || a.n.localeCompare(b.n)), mx = L.length ? L[0].g : 1;
            $('s').innerHTML = L.length ? L.map((p, i) => '<div class="row' + (i == 0 ? ' boot' : '') + '"><div class="rk">' + (i + 1) + '</div><div><b style="text-transform:uppercase">' + esc(p.n) + '</b>' + (i == 0 ? '<span class="tag">GOLDEN BOOT</span>' : '') + '<small>' + esc(p.t) + '</small><div class="bar"><i style="width:' + Math.round(p.g / mx * 100) + '%"></i></div></div><div class="g">' + p.g + '</div></div>').join('') : '<div class="empty">No goals recorded yet.</div>';
            let t = ''; Object.keys(G).forEach(g => {
                const r = rank(g), dn = gDone(g); t += '<div class="gh">GROUP ' + g + (dn ? '<span class="tag">COMPLETE</span>' : '') + '</div><div class="sw"><table><tr><th>#</th><th>TEAM</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>PTS</th></tr>'
                    + r.map((x, i) => '<tr' + (i < 2 ? ' class="q"' : '') + '><td>' + (i + 1) + '</td><td>BRHS ' + esc(x.t) + '</td><td>' + x.p + '</td><td>' + x.w + '</td><td>' + x.d + '</td><td>' + x.l + '</td><td>' + (x.gf - x.ga > 0 ? '+' : '') + (x.gf - x.ga) + '</td><td>' + x.pt + '</td></tr>').join('') + '</table></div>'
                    + (dn && tie(g) ? '<p class="note">⚠ Teams are level on points, goal difference and goals. Set the right team by editing the quarter-final match.</p>' : '')
            });
            t += '<p class="note">Top 2 of each group go to the quarter finals. Win 3, draw 1. Ties: goal difference, then goals scored.</p>' + (ADMIN ? '<form id="gf"><div class="stg" style="margin:0">Group setup</div><p class="note" style="margin:0">Groups are assumed from the fixture order. Edit if they are different (batch numbers, comma separated).</p>'
                + Object.keys(G).map(g => '<label>Group ' + g + '<input name="g' + g + '" value="' + esc(G[g].join(', ')) + '"></label>').join('') + '<button class="btn" type="submit">SAVE GROUPS</button></form>' : '');
            $('t').innerHTML = t; $('cM').textContent = played + '/23'; $('cG').textContent = goals; $('cT').textContent = L.length ? L[0].n : '-';
        }
        $('nav').onclick = e => { const b = e.target.closest('button'); if (!b) return; document.querySelectorAll('#nav button').forEach(x => x.classList.toggle('on', x == b));['m', 's', 't'].forEach(k => $(k).hidden = k != b.dataset.t); scrollTo({ top: 0 }) };
        $('fl').onclick = e => { const b = e.target.closest('button'); if (!b) return; flt = b.dataset.f; document.querySelectorAll('#fl button').forEach(x => x.classList.toggle('on', x == b)); render() };
        $('ml').onclick = e => { const b = e.target.closest('.eb'); if (b) openEdit(+b.dataset.n) };
        function openEdit(n) {
            if (!ADMIN) return; cur = n; const f = FX[n - 1], r = R[n] || {}, F = $('ef').elements; $('sht').textContent = 'MATCH #' + String(n).padStart(2, '0'); $('shs').innerHTML = '<span>' + ST[f[0]] + '</span><span>' + f[3] + '</span>';
            F.ta.value = nm(n, 'a'); F.tb.value = nm(n, 'b'); F.sa.value = r.done ? r.sa : ''; F.sb.value = r.done ? r.sb : '';
            F.ga.value = (r.ga || []).map(g => g[0] + (g[1] > 1 ? ' ' + g[1] : '')).join(', '); F.gb.value = (r.gb || []).map(g => g[0] + (g[1] > 1 ? ' ' + g[1] : '')).join(', '); F.mo.value = r.mo || ''; F.pw.value = r.pw || '';
            $('pwl').hidden = f[0] == 'G'; $('clr').hidden = !r.done; $('sh').hidden = false
        }
        const closeEdit = () => { $('sh').hidden = true };
        $('cx').onclick = closeEdit; $('sh').onclick = e => { if (e.target == $('sh')) closeEdit() }; addEventListener('keydown', e => { if (e.key == 'Escape') closeEdit() });
        $('ef').onsubmit = e => {
            e.preventDefault(); const F = e.target.elements, n = cur, r = { done: true, sa: +F.sa.value || 0, sb: +F.sb.value || 0, ga: parse(F.ga.value), gb: parse(F.gb.value), mo: F.mo.value.trim(), pw: F.pw.value };
            const ta = F.ta.value.trim(), tb = F.tb.value.trim(); if (ta && ta !== nm(n, 'a', true)) r.ta = ta; if (tb && tb !== nm(n, 'b', true)) r.tb = tb; const pv = snap(); R[n] = r; render(); closeEdit(); persist(pv)
        };
        $('clr').onclick = () => { if (confirm('Clear the result of this match?')) { const pv = snap(); delete R[cur]; render(); closeEdit(); persist(pv) } };
        $('t').onsubmit = e => { e.preventDefault(); const F = e.target.elements, g = {}; Object.keys(G).forEach(k => { g[k] = F['g' + k].value.split(',').map(x => x.trim()).filter(Boolean).map(x => x.padStart(2, '0')) }); const pv = snap(); G = g; render(); persist(pv) };

        const snap = () => JSON.stringify({ R, G });
        function toast(m, ok) { const t = $('toast'); t.textContent = m; t.className = 'on ' + (ok ? 'ok' : 'bad'); clearTimeout(toast.t); toast.t = setTimeout(() => { t.className = '' }, 4500) }
        function hdr() {
            $('adm').textContent = MODE === 'local' ? 'DEMO MODE · results save on this device only (add Firebase config to share live)' : ADMIN ? 'ADMIN MODE · tap a match to enter or edit its result' : '';
            $('upd').textContent = U0 ? 'Last updated ' + new Date(U0).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
            $('lgl').hidden = MODE === 'local'; $('lgl').textContent = ADMIN ? 'Admin logout' : 'Admin login'
        }
        async function persist(prev) {
            const st = { R, G }, u = Date.now();
            if (MODE === 'local') { try { localStorage.setItem('brhsHubLocal', JSON.stringify(st)) } catch (e) { } U0 = u; hdr(); return }
            try { await F.setDoc(F.doc(DB, 'hub', 'season3'), { json: JSON.stringify(st), u }) }
            catch (e) { try { const p = JSON.parse(prev); R = p.R; G = p.G } catch (_) { } render(); toast(e.code === 'permission-denied' ? 'Not allowed. Log in as admin.' : '✕ Not saved (' + (e.code || 'error') + '). Try again.', false) }
        }
        async function initFb() {
            if (!CFG.apiKey) { MODE = 'local'; ADMIN = true; try { const s = JSON.parse(localStorage.getItem('brhsHubLocal') || 'null'); if (s) { R = s.R || {}; G = s.G || G } } catch (e) { } render(); hdr(); return }
            const B = 'https://www.gstatic.com/firebasejs/10.12.2/';
            try {
                const [A, Fs, Au] = await Promise.all([import(B + 'firebase-app.js'), import(B + 'firebase-firestore.js'), import(B + 'firebase-auth.js')]);
                const app = A.initializeApp(CFG); DB = Fs.getFirestore(app); AUTH = Au.getAuth(app); F = Fs; AU = Au;
                F.onSnapshot(F.doc(DB, 'hub', 'season3'), s => { if (s.exists()) { try { const st = JSON.parse(s.data().json); R = st.R || {}; if (st.G) G = st.G; U0 = s.data().u || 0 } catch (e) { } } render(); hdr() }, e => toast('Could not load results (' + (e.code || 'error') + ')', false));
                AU.onAuthStateChanged(AUTH, u => { ADMIN = !!u && (!ADMIN_EMAILS.length || ADMIN_EMAILS.includes(u.email)); render(); hdr() });
            } catch (e) { toast('Live results are unavailable. Check your connection.', false) }
        }
        $('lgl').onclick = e => { e.preventDefault(); if (ADMIN && AUTH) AU.signOut(AUTH); else $('lg').hidden = false };
        $('lcx').onclick = () => { $('lg').hidden = true };

            e.preventDefault(); if (!AUTH) { toast('Live service is not ready yet', false); return } const f = e.target.elements;
            try { await AU.signInWithEmailAndPassword(AUTH, f.e.value.trim(), f.p.value); $('lg').hidden = true; e.target.reset(); toast('✓ Logged in as admin', true) } catch (er) { toast('Login failed (' + (er.code || 'error') + ')', false) }
        };
